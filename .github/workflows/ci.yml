name: CI — awesome-os/lo (Holo v11 CAS + HoloFFI Dynamic V8 16+)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-lo-ghost-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hydrate Dynamic V8 + Native Shards from Canonical O(1) Ghost CAS (cas-v1)
        run: node ghost-hydrate.mts
      - name: Verify Ghost CAS Quickstart (149+ entries, 35/35 5-OS shards, Wave 2 TS 6.0.3, 4-OS ABI)
        run: node examples/ghost-cas-quickstart.mts
